name: GMM Auto
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BLOG_URL: https://gmmcricket.blogspot.com
    steps:
      - uses: actions/checkout@v4
      - name: Check Blog
        run: |
          echo "Checking $BLOG_URL"
          curl -L "$BLOG_URL" -o blog.html
          echo "Blog OK"
          ls -lh
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull --rebase origin main || true
          date > last_run.txt
          git add last_run.txt blog.html || true
          git commit -m "auto update" || echo "nothing to commit"
          git push origin main || git push origin main --force-with-lease
