name: GMM Auto
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python main.py
      - run: |
          git config user.name "GMM"
          git config user.email "gmm@gmm.com"
          git add index.html
          git commit -m "auto update" || true
          git push
