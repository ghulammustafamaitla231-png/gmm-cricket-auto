name: GMM Auto
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BLOG_URL: https://gmmcricket.blogspot.com
    steps:
      - uses: actions/checkout@v4
      - name: Check Blog
        run: |
          echo "Checking $BLOG_URL"
          curl -L "$BLOG_URL" -o blog.html
          echo "Blog OK"
          ls -lh
